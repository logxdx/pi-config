<!doctype html><title>Widgets</title><h1>Widgets</h1>
<div id=cb role=combobox aria-haspopup=listbox aria-expanded=false aria-controls=lb tabindex=0 aria-label="Fruit">Pick a fruit</div>
<button id=menubtn aria-haspopup=menu aria-expanded=false>Actions</button>
<div id=editor contenteditable=true data-placeholder="Write a note" style="border:1px solid #888;min-height:40px;width:300px"></div>
<label>Date <input type=date id=d></label>
<label>Volume <input type=range id=r min=0 max=10 value=3></label>
<input id=dl list=cities aria-label="City"><datalist id=cities><option value="Paris"><option value="Berlin"></datalist>
<div id=state></div>
<script>
const log = (e) => fetch(`/log?e=${encodeURIComponent(e)}`);
const cb = document.getElementById("cb");
let lb;
const open = () => { if (lb) return; lb = document.createElement("ul"); lb.id = "lb"; lb.setAttribute("role","listbox");
 for (const f of ["Apple","Banana","Blueberry","Cherry"]) { const li = document.createElement("li"); li.setAttribute("role","option"); li.textContent = f; li.style.cursor="pointer";
  li.addEventListener("click", () => { cb.textContent = f; cb.setAttribute("aria-expanded","false"); lb.remove(); lb = null; log("fruit="+f); }); lb.append(li); }
 document.body.append(lb); cb.setAttribute("aria-expanded","true"); };
cb.addEventListener("click", open);
const mb = document.getElementById("menubtn"); let menu;
mb.addEventListener("click", () => { if (menu) return; menu = document.createElement("div"); menu.setAttribute("role","menu");
 for (const f of ["Rename","Archive","Delete"]) { const it = document.createElement("div"); it.setAttribute("role","menuitem"); it.textContent = f; it.style.cursor="pointer";
  it.addEventListener("click", () => { menu.remove(); menu = null; log("menu="+f); }); menu.append(it); } document.body.append(menu); });
document.getElementById("editor").addEventListener("input", (e) => log("editor="+e.target.innerText.replace(/\n/g,"|")));
document.getElementById("d").addEventListener("change", (e) => log("date="+e.target.value));
document.getElementById("r").addEventListener("change", (e) => log("range="+e.target.value));
document.getElementById("dl").addEventListener("change", (e) => log("city="+e.target.value));
</script>
