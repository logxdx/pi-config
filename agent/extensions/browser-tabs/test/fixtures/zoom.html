<!doctype html><title>Zoom</title>
<style>
html,body{margin:0;height:100%;background:#f4f4f2;font:14px sans-serif;color:#888}
.t{position:absolute;width:28px;height:28px;cursor:pointer}
#red{left:1690px;top:110px;background:#d22}
#blue{left:230px;top:880px;background:#22d;border-radius:50%}
#green{left:1490px;top:850px;width:0;height:0;border-left:16px solid transparent;border-right:16px solid transparent;border-bottom:28px solid #2a2}
#star{left:890px;top:480px;width:auto;height:auto;font-size:30px;line-height:30px;color:#f80}
p{position:absolute;margin:0}
</style>
<p style="left:40px;top:40px">Small targets for the vision zoom test. Lorem ipsum dolor sit amet, consectetur adipiscing elit.</p>
<p style="left:600px;top:300px">Some distractor text here, and more there.</p>
<p style="left:1200px;top:640px">Another paragraph far from the targets.</p>
<div class=t id=red title="red square"></div>
<div class=t id=blue title="blue circle"></div>
<div class=t id=green title="green triangle"></div>
<div class=t id=star title="orange star">★</div>
<script>
const log = (q) => fetch(`/log?${q}`);
for (const el of document.querySelectorAll(".t"))
  el.addEventListener("click", (e) => { e.stopPropagation(); log(`e=zoom-hit&id=${el.id}&trusted=${e.isTrusted}`); });
document.addEventListener("click", (e) => log(`e=zoom-miss&x=${Math.round(e.clientX)}&y=${Math.round(e.clientY)}&trusted=${e.isTrusted}`));
</script>
