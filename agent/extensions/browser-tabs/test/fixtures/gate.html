<!doctype html><title>Gate</title><h1>Gate page</h1>
<form id=login method=post action="/log" onsubmit="log('login-submit');return false">
<label>Username <input id=user></label>
<label>Password <input id=pw type=password></label>
<label>Card <input id=cc autocomplete=cc-number></label>
<label>Code <input id=otp autocomplete=one-time-code></label>
<button type=submit id=signin>Sign in</button>
</form>
<form id=search method=get action="/x" onsubmit="return false"><label>Search <input id=q></label><button type=button id=find>Find</button></form>
<h2>Wireless mouse</h2><button class=add id=add1>Add to cart</button>
<h2>USB-C cable</h2><button class=add id=add2>Add to cart</button>
<div style="cursor:pointer" onclick="log('clicky')">Clicky div</div>
<div tabindex=0 role=none onclick="log('tabindex-div')">Focusable div</div>
<div aria-hidden=true>Hidden decoy text</div>
<a href="/form.html" id=golink>Go to form page</a>
<button id=plain>Show details</button>
<div id=stale><button id=sb onclick="log('stale-click')">Refresh me</button></div>
<button id=rerender onclick="document.getElementById('stale').innerHTML='<button id=sb onclick=&quot;log(\'stale-click2\')&quot;>Refresh me</button>'">Re-render</button>
<label>Colour <select id=colour><option value=r>Red</option><option value=g>Green</option><option value=b>Blue</option></select></label>
<script>
const log = (e) => fetch(`/log?e=${encodeURIComponent(e)}`);
document.getElementById("user").addEventListener("input", (e) => log("user=" + e.target.value));
document.getElementById("pw").addEventListener("input", (e) => log("pw=" + e.target.value));
document.getElementById("plain").addEventListener("click", () => log("plain-click"));
document.getElementById("find").addEventListener("click", () => log("find-click"));
document.querySelectorAll(".add").forEach((b) => b.addEventListener("click", () => log("add=" + b.id)));
document.getElementById("colour").addEventListener("change", (e) => log("colour=" + e.target.value));
</script>
